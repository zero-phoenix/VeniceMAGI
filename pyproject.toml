# Configuración centralizada del proyecto.
#
# Reúne en un solo sitio lo que antes estaba disperso: pytest.ini, las flags de
# ruff sueltas en CI, pyrightconfig.json y requirements.txt. Misma configuración
# que antes; ahora vive en un lugar y tiene una sola fuente de verdad.

[project]
name = "venicemagi"
version = "2.2.0"
description = "Variante MAGI cloud-first gratuita: enjambre dialéctico sobre proveedores guest sin key ni login, con IDE real sobre tu máquina."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `--timeout` global: ningún test puede colgar la suite. 120 s es holgado para
# todo lo que no compila (el 99%); los que compilan un .exe llevan su propia
# marca con 300. Sin esto, un cuelgue no falla: bloquea, que es peor porque no
# deja diagnóstico.
addopts = "-q --no-header --timeout=120"
markers = [
    "slow: tests that compile or run heavy artifacts (e.g. PyInstaller builds)",
    # `timeout` ya NO se declara aquí: la registra `pytest-timeout`, que ahora
    # sí está instalado. Declararla a mano era justo lo que ocultaba el
    # problema — pytest no avisaba de marca desconocida y todo el mundo daba
    # por hecho que el plazo se aplicaba. No se aplicaba.
    # Ver tests/conftest.py: el test que la lleva toca la frontera con el
    # exterior a propósito (red, disco, navegador). A cambio no puede afirmar
    # nada que dependa de lo que haya instalado, porque en el CI hay otra cosa.
    "frontera: el test cruza la frontera con el exterior a propósito",
    # Ver tests/conftest.py: por defecto los tests ven un catálogo de
    # proveedores CONGELADO. Esta marca pide el de verdad, y solo la necesitan
    # los tests que comprueban el catálogo en sí (que el JSON coincida con las
    # constantes, que toda familia verificada tenga candidatos).
    "catalogo_real: el test lee el catálogo de proveedores de verdad",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    # curl_cffi (interno de g4f) registra un selector thread porque el
    # ProactorEventLoop de Windows no implementa add_reader. Es inofensivo
    # (es cómo curl_cffi funciona bajo Proactor) pero ensucia la salida de
    # tests. No podemos cambiar de policy: el SelectorEventLoop no soporta
    # asyncio.subprocess en Windows, que el proyecto sí usa (Naoko, run_tests).
    #
    # Dos detalles, y sin cualquiera de los dos el filtro no filtra nada:
    #
    # 1. NO se nombra la clase curl_cffi.utils.CurlCffiWarning. Nombrarla obliga
    #    a pytest a importar curl_cffi al leer la configuración, y donde no está
    #    instalado —el runner de Linux del CI, un clon recién hecho— eso emite
    #    «PytestConfigWarning: Failed to import filter module»: el filtro puesto
    #    para quitar un aviso creaba otro en la mitad de las máquinas.
    #
    # 2. El `(?s).*` del principio NO es adorno. El campo de mensaje es una
    #    expresión regular ANCLADA AL INICIO (re.match), y el mensaje real de
    #    curl_cffi empieza con un salto de línea y cuatro espacios:
    #
    #        CurlCffiWarning: \n    Proactor event loop does not implement...
    #
    #    Un patrón que empiece por «Proactor» no casa nunca, y el filtro parece
    #    puesto sin estarlo. Es el fallo más silencioso de esta clase: la
    #    configuración es válida, pytest no protesta, y el aviso sigue saliendo.
    "ignore:(?s).*Proactor event loop does not implement add_reader",
    # Naoko lanza un _watch_loop en su constructor. Aunque el test lo cancela,
    # el recolector de Python puede emitir ResourceWarning sobre transports
    # que ya están cerrándose. Cosmético.
    "ignore:unclosed transport:ResourceWarning",
]

# --- ruff ---------------------------------------------------------------
# line-length = 100 sigue la convención REAL del código (p99 = 100, solo el 1%
# de las líneas la supera). Forzar 88 habría reformateado medio repositorio.
[tool.ruff]
line-length = 100
extend-exclude = [
    "vmagi/_attic",      # andamiaje retirado: se conserva como mapa, no se mantiene
    "vmagi-gui",         # frontend TypeScript/Tauri, no es código Python
    "build",
    "dist",
]

[tool.ruff.lint]
# Set inicial deliberadamente CONSERVADOR: errores y warnings que indican
# bugs reales o problemas de mantenimiento, no estilo opinable. Se amplía
# progresivamente a medida que la deuda existente se salda.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports/vars, undefined names...)
    "W",    # pycodestyle warnings
    "I",    # isort (orden de imports)
    "UP",   # pyupgrade (sintaxis moderna)
    "B",    # flake8-bugbear (bugs comunes probables)
]
# E501 queda fuera hasta saldar la deuda: 268 lineas pasan de 100 y tocarlas
# a mano hoy es ruido sin beneficio. El resto de las reglas SI bloquea: la
# deuda pendiente tras la limpieza del 2026-08-16 es cero en errores reales
# (F, E722, E741, B...) y debe seguir siendolo.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests pueden tener imports sin uso (fixtures) y nombres ambigüos.
"tests/**/*.py" = ["F401", "F841"]

# main.py configura la consola ANTES de importar webview y la GUI: si no, el
# primer print en cp1252 tira toda la consola en Windows. Los imports por
# debajo de esa llamada son deliberados.
"vmagi/main.py" = ["E402"]

# NOTA: la config de pyright sigue en pyrightconfig.json. pyright no está en
# requirements (es opcional, para desarrollo) y no podemos verificar localmente
# si lee [tool.pyright] desde aquí, así que no se duplica.
