syntax = "proto3";

package vmagi.gui;

// Pilar 3: Definición en Protocol Buffers.
// Elimina la sobrecarga de JSON en los debates masivos y telemetría de 60fps.

message MagiEvent {
  string topic = 1;
  bytes payload = 2; // Puede ser JSON empaquetado o BSON
  int64 timestamp = 3;
}

message MagiConnectRequest {
  string client_version = 1;
  string workspace = 2;
}

message MagiConnectResponse {
  bool success = 1;
  string session_token = 2;
  string error_message = 3;
}

message EmergencyStop {
  string reason = 1;
  string actor = 2;
}

service MagiBroker {
  // Suscripción al stream de eventos del bus
  rpc SubscribeBus(MagiConnectRequest) returns (stream MagiEvent);
  
  // Detención de emergencia (ESTOP)
  rpc TriggerEstop(EmergencyStop) returns (MagiConnectResponse);
}
