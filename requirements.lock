# BLOQUEO DE VERSIONES PARA LA COMPILACIÓN DEL .EXE  (Windows · Python 3.10)
# ---------------------------------------------------------------------------
#
# POR QUÉ EXISTE
# ==============
# `requirements.txt` mezcla tres cosas: pines exactos (requests==2.33.0),
# rangos (capstone>=5.0) y dependencias sin pin (g4f, httpx, pydantic). Con eso,
# el .exe de una versión publicada NO es reproducible: recompilar el mismo tag
# dentro de seis meses instala lo que haya ese día en PyPI. Y si un upstream
# publica una versión incompatible, la compilación se rompe sin que nada haya
# cambiado en este repositorio — el peor tipo de fallo, porque el commit
# culpable no es tuyo.
#
# Este fichero fija las 94 dependencias —directas y transitivas— con las que se
# compiló el binario. Recompilar el tag da el mismo .exe.
#
# POR QUÉ SOLO PARA WINDOWS
# =========================
# Está generado SIN marcadores de entorno y contiene paquetes que solo existen
# en Windows: `pythonnet`, `clr-loader`, `pywin32-ctypes` y `proxy-tools`, todos
# arrastrados por pywebview. Un `pip install -r requirements.lock` en Linux
# falla.
#
# Por eso el reparto de responsabilidades en los workflows es este, y conviene
# no cambiarlo sin entenderlo:
#
#   ci.yml (Linux + Windows, py3.10 y 3.11) ....... requirements.txt
#       Prueba que el proyecto funciona con las versiones ACTUALES de sus
#       dependencias. Si un upstream rompe algo, aquí es donde debe verse,
#       cuanto antes.
#
#   release.yml, job `build` (Windows, py3.10) .... requirements.lock
#       Compila el binario que se publica. Aquí no se quiere la última versión:
#       se quiere EXACTAMENTE la que se probó.
#
# NOTA SOBRE curl_cffi  (2026-08-13)
# ==================================
# `requirements.txt` lo tenia clavado en ==0.5.10 y esto habria publicado un
# binario roto sin que nada avisara: al montar un entorno limpio desde ESTE
# fichero —lo mismo que hace el job que produce el .exe— Perplexity, que sirve
# toda la familia `claude`, fallaba con
#
#     RequestsError: impersonate chrome is not supported
#
# En la maquina de desarrollo habia 0.16.0 instalado, asi que alli funcionaba.
# El pin llevaba tiempo mintiendo y solo se vio al construir el entorno del
# release de verdad. Un pin que nadie usa no protege: engana.
#
# NOTA SOBRE pytest-timeout
# =========================
# Entra el 2026-08-13 y merece su línea: la marca `@pytest.mark.timeout(300)`
# llevaba tiempo puesta en los tests que compilan un .exe y NO HACÍA NADA, porque
# el plugin no estaba instalado. Medido: la suite pasó de 533 s a colgarse
# indefinidamente sin que nada la matara. Una marca que documenta una garantía
# inexistente es peor que no tenerla, porque se confía en ella.

# NOTA SOBRE camoufox / playwright
# ================================
# Entran por la sesión web headless. `playwright` es el más pesado de los dos y
# NO trae el navegador: eso son ~100 MB que se bajan aparte con `camoufox
# fetch`, y a propósito no van en el binario. `PySide6` NO está aquí y no debe
# estarlo: es el extra `[gui]` de camoufox, un toolkit de ventanas entero.
#
# CÓMO SE REGENERA
# ================
#   pip install pip-tools
#   python -m piptools compile --strip-extras -o requirements.lock requirements.txt
#
# Hazlo en Windows con Python 3.10 (lo que usa el job de build) y en el mismo
# commit en el que toques requirements.txt: `test_lock_reproducible` comprueba
# que las dos listas no se separen.
#
# Y ojo: pip-compile REESCRIBE el fichero entero y se lleva por delante esta
# cabecera. Hay que volver a ponerla.
#
